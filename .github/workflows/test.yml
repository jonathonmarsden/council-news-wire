name: Test & Lint

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: council_news_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 pylint mypy
    
    - name: Check syntax with flake8
      run: |
        # Stop build on syntax errors
        flake8 core/ main.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warn on style issues (don't fail)
        flake8 core/ main.py --count --exit-zero --statistics | head -20
    
    - name: Type check with mypy
      run: |
        mypy core/ main.py --ignore-missing-imports --no-error-summary 2>/dev/null || true
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        # Live-site tests are marked 'integration' and excluded by default
        # (pytest.ini). CI runs only the hermetic suite, so a council being
        # briefly down can never fail the build. Run integration tests
        # deliberately with: pytest -m integration
        pytest tests/ --cov=core --cov-report=xml
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/council_news_test
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # Rejects pull requests whose commit messages, commit authors, title, body
    # or added lines match a deny pattern kept in the METADATA_DENY_PATTERN
    # secret (so the list itself is never published). Matches are reported
    # by location only.
    - name: Check commit metadata
      if: github.event_name == 'pull_request'
      env:
        PATTERN: ${{ secrets.METADATA_DENY_PATTERN }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
      run: |
        if [ -z "$PATTERN" ]; then echo "::warning::METADATA_DENY_PATTERN not set; skipped"; exit 0; fi
        fail=0
        for c in $(git rev-list "$BASE..$HEAD"); do
          # Names, not email addresses: the owner's own address is on the list
          # (to keep it out of files) and would otherwise match every commit.
          if git log -1 --format='%an%n%cn%n%B' "$c" | grep -qiE "$PATTERN"; then
            echo "::error::commit $c: message or author matches the deny pattern"; fail=1
          fi
        done
        if printf '%s' "$PR_TEXT" | grep -qiE "$PATTERN"; then echo "::error::PR title or body matches the deny pattern"; fail=1; fi
        n=$(git diff "$BASE...$HEAD" | grep -E '^\+' | grep -v '^+++' | grep -ciE "$PATTERN" || true)
        if [ "$n" != "0" ]; then echo "::error::$n added line(s) match the deny pattern"; fail=1; fi
        exit $fail
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.10'
    
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort
    
    - name: Check code formatting with black
      run: |
        black --check core/ main.py --quiet
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only core/ main.py
      continue-on-error: true
    
    - name: Lint with pylint
      run: |
        pylint core/ main.py --disable=all --enable=E,F --exit-zero
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.10'
    
    - name: Install bandit
      run: |
        pip install bandit
    
    - name: Security scan with bandit
      run: |
        bandit -r core/ main.py --exit-code 0 -f txt | head -30
      continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    
    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        tags: council-news-bot:test

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Check documentation exists
      run: |
        [ -f docs/operations/RUNBOOK.md ] && echo "✅ RUNBOOK.md" || (echo "❌ Missing RUNBOOK.md" && exit 1)
        [ -f docs/operations/MONITORING.md ] && echo "✅ MONITORING.md" || (echo "❌ Missing MONITORING.md" && exit 1)
        [ -f docs/architecture/SYSTEM_DESIGN.md ] && echo "✅ SYSTEM_DESIGN.md" || (echo "❌ Missing SYSTEM_DESIGN.md" && exit 1)
    
    - name: Validate markdown format
      run: |
        # Check for common markdown issues
        grep -r "TODO\|FIXME\|XXX" docs/ && echo "⚠️  Found TODO comments" || echo "✅ No TODO comments"

  edge:
    # The edge service (Bluesky feeds + RSS). Its logic tests import nothing
    # outside Node, so no npm install is needed.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
    - name: Edge logic tests
      run: cd edge && node --test test/*.test.ts
